<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Atendimento | Carica Pro</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 10px;
            color: #fff;
        }
        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Carica Pro</h2>
        <p>Clica no botão abaixo para iniciar o teu atendimento exclusivo no WhatsApp com a nossa equipa:</p>
        <a href="#" onclick="redirecionarWhatsApp(event)" class="btn">💬 Falar no WhatsApp</a>
    </div>

    <script>
        function redirecionarWhatsApp(event) {
            event.preventDefault();
            
            // Lista com os dois números do WhatsApp para rodízio 50/50
            const numeros = [
                "5527992456099", // Atendente 01
                "5527992564791"  // Atendente 02
            ];

            // Sorteia aleatoriamente um dos números
            const numeroAleatorio = numeros[Math.floor(Math.random() * numeros.length)];

            // Mensagem personalizada limpa
            const mensagem = "Oii, vim pelo instagram, e queria criar uma arte!";

            // Redireciona para o WhatsApp escolhido
            window.location.href = `https://wa.me/${numeroAleatorio}?text=${encodeURIComponent(mensagem)}`;
        }
    </script>
</body>
</html>
